[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-playback"
version = "0.1.0"
description = "A compact Windows taskbar and tray remote for Android media through KDE Connect"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6-Essentials==6.10.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.gui-scripts]
phone-playback = "phone_playback.ui:main"

[project.urls]
Repository = "https://github.com/KigoJomo/phone-playback"
Issues = "https://github.com/KigoJomo/phone-playback/issues"

[tool.setuptools.packages.find]
include = ["phone_playback*"]

[tool.ruff]
line-length = 100
